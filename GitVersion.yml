mode: ContinuousDelivery
# Versions come from release tags on master (first: 0.5.0, after the Store's 0.4.4). next-version is just
# a floor: once a release tag is at or above it, the tag wins. Raise it to jump to e.g. 0.6.0 or 1.0.0.
next-version: 0.5.0
branches:
  feature:
    increment: Patch
  develop:
    increment: Patch
